# Supply-chain policy enforced by `cargo deny check`.
# Rationale and admission rules: docs/dependency-policy.md.
#
# Exceptions are reviewed records, not silences. Every `ignore`/`skip` entry must
# name the affected reachability, the compensating control, an owner and an
# expiry date in its `reason`, e.g.
#   { id = "RUSTSEC-0000-0000", reason = "not reachable: <why>; control: <what>; owner: <who>; expires: 2026-12-31" }

[graph]
# Evaluate every optional backend and feature a generated application can enable.
all-features = true

[advisories]
version = 2
db-urls = ["https://github.com/rustsec/advisory-db"]
# Yanked releases must be replaced, never silently kept.
yanked = "deny"
# Unmaintained or unsound crates anywhere in the graph need a recorded decision.
unmaintained = "all"
unsound = "all"
ignore = []

[licenses]
version = 2
# Permissive licenses compatible with MIT OR Apache-2.0 distribution. Copyleft,
# source-available, unknown or unlicensed code needs legal review first.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.93
# The list states policy; a license need not be in use to be acceptable.
unused-allowed-license = "allow"

# Scoped exceptions: a license accepted for one crate only, with its reason.
[[licenses.exceptions]]
# Mozilla's CA root bundle used by SQLx's rustls TLS (`tls-rustls-ring-webpki`)
# and by the OTLP exporter of forge-telemetry (ADR 0033).
# CDLA-Permissive-2.0 is a permissive data license (no copyleft); keep its text
# with binary distributions. Reviewed 2026-10-14; revisit if the bundle changes.
crate = "webpki-roots"
allow = ["CDLA-Permissive-2.0"]

[[licenses.exceptions]]
# libFuzzer, whose sources libfuzzer-sys vendors and compiles for the fuzz/
# package only (docs/dependency-policy.md, "Fuzzing"; ADR 0043). NCSA is the
# University of Illinois/NCSA license: permissive, BSD-style, OSI approved, no
# copyleft. Reachability: fuzz/ is a standalone workspace that is never linked
# into a released artifact, so this exception is only evaluated by
# `cargo deny --manifest-path fuzz/Cargo.toml` (the workspace run reports it as
# not encountered). Owner: the maintainers (CODEOWNERS). Reviewed 2026-10-20;
# expires 2027-10-20, when it is re-reviewed or removed.
crate = "libfuzzer-sys"
allow = ["NCSA"]

[bans]
# Duplicate versions are reviewed (docs/dependency-policy.md), not auto-failed.
multiple-versions = "warn"
wildcards = "deny"
# Workspace crates are `publish = false` until a release process exists; their
# internal path dependencies are pinned by the lockfile and reviewed in-repo.
# Publishing requires versioned internal dependencies, which this gate enforces.
allow-wildcard-paths = true
highlight = "all"

[sources]
# crates.io only. Git dependencies are prohibited in releases unless an incident
# exception pins an immutable commit with provenance and expiry.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
