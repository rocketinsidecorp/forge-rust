[workspace]
members = [
    "crates/forge",
    "crates/forge-audit",
    "crates/forge-auth",
    "crates/forge-cli",
    "crates/forge-config",
    "crates/forge-core",
    "crates/forge-db",
    "crates/forge-http",
    "crates/forge-security",
    "crates/forge-tenancy",
    "crates/forge-views",
]
# Examples are standalone applications, exactly as `forge new` generates them.
exclude = ["examples"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "MIT"
repository = "https://github.com/rocketinsidecorp/forge-rust"
authors = ["Forge contributors"]

[workspace.dependencies]
askama = { version = "0.16.1", default-features = false, features = ["derive", "std"] }
async-trait = "0.1.92"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive"] }
http = "1.5.0"
http-body-util = "0.1.5"
hyper = { version = "1.11.1", features = ["http1", "server"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = { version = "0.11.0", default-features = false }
sqlx = { version = "0.9", default-features = false, features = ["migrate", "runtime-tokio", "tls-rustls-ring-webpki", "uuid"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7.19", features = ["rt"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "json"] }
uuid = { version = "1.26.1", features = ["serde", "v7"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"

