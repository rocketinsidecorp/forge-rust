[workspace]
members = [
    "crates/forge",
    "crates/forge-audit",
    "crates/forge-auth",
    "crates/forge-broadcast",
    "crates/forge-cache",
    "crates/forge-cli",
    "crates/forge-config",
    "crates/forge-core",
    "crates/forge-credentials",
    "crates/forge-db",
    "crates/forge-encryption",
    "crates/forge-events",
    "crates/forge-http",
    "crates/forge-i18n",
    "crates/forge-jobs",
    "crates/forge-macros",
    "crates/forge-mail",
    "crates/forge-openapi",
    "crates/forge-proxy",
    "crates/forge-ratelimit",
    "crates/forge-security",
    "crates/forge-storage",
    "crates/forge-telemetry",
    "crates/forge-tenancy",
    "crates/forge-views",
]
# Examples are standalone applications, exactly as `forge new` generates them.
exclude = ["examples"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "MIT"
repository = "https://github.com/rocketinsidecorp/forge-rust"
authors = ["Forge contributors"]

[workspace.dependencies]
askama = { version = "0.16.1", default-features = false, features = ["derive", "std"] }
async-trait = "0.1.92"
base64 = { version = "0.22.1", default-features = false, features = ["alloc"] }
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive"] }
cookie = { version = "0.18.2", default-features = false, features = ["percent-encode"] }
# gzip for OTLP export bodies (FORGE_TELEMETRY_OTLP_COMPRESSION=gzip); pure-Rust miniz_oxide backend.
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
getrandom = "0.4.3"
hmac = { version = "0.13.0", default-features = false }
http = "1.5.0"
http-body-util = "0.1.5"
hyper = { version = "1.11.1", features = ["http1", "server"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
# AES-256-GCM for TOTP seeds at rest (forge-auth): the ring already in the
# graph through rustls; no default features.
ring = { version = "0.17.14", default-features = false }
# TLS for the OTLP exporter: the rustls/ring/webpki-roots stack SQLx already uses.
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustix = { version = "1.1.5", default-features = false, features = ["fs", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# HMAC-SHA-1 of RFC 6238 TOTP codes (forge-auth), the RustCrypto release
# already locked through sqlx-mysql.
sha1 = { version = "0.11.0", default-features = false }
sha2 = { version = "0.11.0", default-features = false }
sqlx = { version = "0.9", default-features = false, features = ["migrate", "runtime-tokio", "tls-rustls-ring-webpki", "uuid"] }
subtle = { version = "2.6.1", default-features = false }
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
tokio-util = { version = "0.7.19", features = ["rt"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "json"] }
webpki-roots = "1.0.9"
url = "2.5.8"
uuid = { version = "1.26.1", features = ["serde", "v7"] }
# Wipes key material and decrypted credentials on drop (forge-encryption,
# forge-credentials); already locked through rustls. No derive macro.
zeroize = { version = "1.9.1", default-features = false, features = ["alloc"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"

