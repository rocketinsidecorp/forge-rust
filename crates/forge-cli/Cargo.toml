[package]
name = "forge-cli"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Command-line tooling for the Forge application framework"

[lints]
workspace = true

[[bin]]
name = "forge"
path = "src/main.rs"

# Test support: the docker CLI stand-in of the real-sshd `forge deploy`
# tests (src/deploy/ssh_tests.rs). Built by `cargo test`, never installed.
[[example]]
name = "fake_docker"
path = "tests/support/fake_docker.rs"
test = false

[dependencies]
clap.workspace = true
# `forge doctor` validates the same FORGE_* settings the application loads and
# redacts database URLs with the same helpers (no new package in Cargo.lock).
forge-config = { path = "../forge-config" }
# `forge credentials` and the development credentials of `forge new`
# (ADR 0041): the same file format and key handling the application reads.
forge-credentials = { path = "../forge-credentials" }
forge-encryption = { path = "../forge-encryption" }
# `forge deploy` shares forge-proxy's Go-compatible durations and
# timestamps, so its flags, lock records and logs read the same as the
# proxy's (no new package in Cargo.lock).
forge-proxy = { path = "../forge-proxy" }
# Random container-name suffixes and ssh control directory names.
getrandom.workspace = true
# Validation patterns and `forge logs --grep`, with Forge-Go's RE2 syntax.
regex-automata.workspace = true
# `forge i18n check` loads config/locales with the translator's own parser
# and rules (no new package in Cargo.lock).
forge-i18n = { path = "../forge-i18n" }
# Reads Cargo's `--message-format=json` to find the binary it built, and
# writes the `forge i18n check --json` report.
serde.workspace = true
serde_json.workspace = true
# One signal thread (SIGINT/SIGTERM) owned by the commands that run children.
tokio.workspace = true
uuid.workspace = true
# Wipes decrypted credentials held by `forge credentials`.
zeroize.workspace = true

# Stops the application and its process group on `forge dev` shutdown, without
# unsafe code or a shell; `process` is the only feature added to the workspace entry.
[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["process"] }

[dev-dependencies]
# tests/scaffold.rs computes the TOTP codes of a generated app's two-factor flow.
forge-auth = { path = "../forge-auth" }
# tests/scaffold.rs provisions a PostgreSQL database for migrate/rollback.
forge-db = { path = "../forge-db", features = ["postgres", "testing"] }
tempfile.workspace = true
