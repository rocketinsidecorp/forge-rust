[package]
name = "forge-macros"
publish = false
description = "Narrowly scoped derives for Forge: #[derive(OpenApiSchema)] (ADR 0039)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
proc-macro = true

[dependencies]
# Already in the locked graph (serde_derive, thiserror-impl, sqlx-macros):
# no new third-party package. No build script, no I/O, no network.
proc-macro2 = "1.0.107"
quote = "1.0.47"
syn = { version = "2.0.119", default-features = false, features = ["clone-impls", "derive", "parsing", "printing", "proc-macro"] }

[lints]
workspace = true
