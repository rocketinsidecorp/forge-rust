[package]
name = "forge-storage"
publish = false
description = "File storage for Forge: Storage port, disk adapter, HMAC-signed links, safe serving and strict multipart uploads"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
async-trait.workspace = true
base64.workspace = true
bytes.workspace = true
forge-config = { path = "../forge-config" }
forge-http = { path = "../forge-http" }
hmac.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
subtle.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true

[target.'cfg(unix)'.dependencies]
rustix.workspace = true

[features]
# The conformance suite every `Storage` must pass (`forge_storage::testing`).
testing = []

[dev-dependencies]
forge-storage = { path = ".", features = ["testing"] }
tempfile.workspace = true

[lints]
workspace = true
