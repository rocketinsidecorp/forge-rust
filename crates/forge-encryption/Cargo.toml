[package]
name = "forge-encryption"
publish = false
description = "Authenticated attribute encryption with key rings, rotation and blind indexes for Forge applications"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
async-trait.workspace = true
base64.workspace = true
forge-core = { path = "../forge-core" }
forge-db = { path = "../forge-db", optional = true }
# `TenantId` of the PostgreSQL rewriter's tenant scope; already in the graph
# through forge-db.
forge-tenancy = { path = "../forge-tenancy", optional = true }
getrandom.workspace = true
# AES-256-GCM, HKDF-SHA256 and HMAC-SHA256 (ADR 0041): the ring already in the
# graph through rustls and forge-auth.
ring.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx = { workspace = true, optional = true }
thiserror.workspace = true
uuid.workspace = true
# Wipes key material and decrypted values on drop; already locked through rustls.
zeroize.workspace = true

[features]
# `EncryptedColumn` re-encryption adapters, one per backend (Cipher::reencrypt).
postgres = ["dep:forge-db", "dep:forge-tenancy", "dep:sqlx", "forge-db/postgres"]
mysql = ["dep:forge-db", "dep:sqlx", "forge-db/mysql"]
sqlite = ["dep:forge-db", "dep:sqlx", "forge-db/sqlite"]

[dev-dependencies]
forge-db = { path = "../forge-db", features = ["postgres", "mysql", "sqlite", "testing"] }
forge-encryption = { path = ".", features = ["postgres", "mysql", "sqlite"] }
# `RlsTestDatabase`: migrator and NOBYPASSRLS runtime roles for the
# row-level security rotation test.
forge-jobs = { path = "../forge-jobs", features = ["testing"] }
sqlx = { workspace = true, features = ["macros"] }
tokio.workspace = true

[lints]
workspace = true
