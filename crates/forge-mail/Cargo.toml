[package]
name = "forge-mail"
publish = false
description = "Email for Forge applications: validated messages, MIME encoding, a TLS-enforcing SMTP sender, development and test senders, askama templates and browser previews"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
askama.workspace = true
async-trait.workspace = true
base64.workspace = true
forge-auth = { path = "../forge-auth" }
forge-config = { path = "../forge-config" }
forge-http = { path = "../forge-http" }
forge-telemetry = { path = "../forge-telemetry" }
getrandom.workspace = true
rustls.workspace = true
serde.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "rt"] }
tokio-rustls.workspace = true
tracing.workspace = true
uuid.workspace = true
webpki-roots.workspace = true

[features]
# `forge_mail::testing::Recorder`, the in-memory sender for application tests.
testing = []

[dev-dependencies]
forge-mail = { path = ".", features = ["testing"] }
serde_json.workspace = true
tempfile.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true
