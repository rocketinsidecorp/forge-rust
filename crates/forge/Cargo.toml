[package]
name = "forge"
publish = false
description = "Application runtime facade for Forge applications"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
forge-audit = { path = "../forge-audit" }
forge-auth = { path = "../forge-auth" }
forge-config = { path = "../forge-config" }
forge-core = { path = "../forge-core" }
forge-db = { path = "../forge-db" }
forge-events = { path = "../forge-events", optional = true }
forge-http = { path = "../forge-http" }
forge-jobs = { path = "../forge-jobs", optional = true }
forge-security = { path = "../forge-security" }
forge-tenancy = { path = "../forge-tenancy" }
forge-views = { path = "../forge-views", optional = true, default-features = false, features = ["runtime"] }
serde.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(unix)'.dependencies]
# Turning terminal echo off while `setup` reads a password (ADR 0026).
rustix = { version = "1.1.5", default-features = false, features = ["std", "termios"] }

[features]
default = ["postgres"]
# Database backends, additive: enable the ones the application declares.
postgres = ["forge-db/postgres"]
# MySQL 8.4+ and MariaDB 11.4+.
mysql = ["forge-db/mysql"]
sqlite = ["forge-db/sqlite"]
# `Composition::for_testing` and `forge::db::testing::TestDatabase`.
testing = ["forge-db/testing", "forge-jobs?/testing"]
# Server-rendered views (ADR 0022): `forge::views` and `forge::web::html`.
views = ["dep:forge-views"]
# Durable PostgreSQL jobs, workers and cron schedules (ADR 0025):
# `forge::jobs`, `App::jobs` and the `jobs` subcommands.
jobs = ["postgres", "dep:forge-jobs"]
# Transactional outbox and idempotent consumers (ADR 0025): `forge::events`
# and `App::events`.
events = ["jobs", "dep:forge-events"]

[dev-dependencies]
async-trait.workspace = true
bytes.workspace = true
forge-db = { path = "../forge-db", features = ["testing"] }
sqlx = { workspace = true, features = ["macros"] }
tempfile.workspace = true
serde_json.workspace = true
uuid.workspace = true

[lints]
workspace = true
