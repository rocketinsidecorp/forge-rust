[package]
name = "forge"
publish = false
description = "Application runtime facade for Forge applications"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
forge-audit = { path = "../forge-audit" }
forge-auth = { path = "../forge-auth" }
forge-broadcast = { path = "../forge-broadcast", optional = true }
forge-config = { path = "../forge-config" }
forge-core = { path = "../forge-core" }
forge-credentials = { path = "../forge-credentials" }
forge-db = { path = "../forge-db" }
forge-encryption = { path = "../forge-encryption" }
forge-events = { path = "../forge-events", optional = true }
forge-http = { path = "../forge-http" }
forge-openapi = { path = "../forge-openapi" }
forge-i18n = { path = "../forge-i18n", optional = true }
forge-jobs = { path = "../forge-jobs", optional = true }
forge-mail = { path = "../forge-mail", optional = true }
forge-cache = { path = "../forge-cache", optional = true }
forge-ratelimit = { path = "../forge-ratelimit", optional = true }
forge-storage = { path = "../forge-storage", optional = true }
forge-security = { path = "../forge-security" }
forge-telemetry = { path = "../forge-telemetry" }
forge-tenancy = { path = "../forge-tenancy" }
forge-views = { path = "../forge-views", optional = true, default-features = false, features = ["runtime"] }
serde.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(unix)'.dependencies]
# Turning terminal echo off while `setup` reads a password (ADR 0026).
rustix = { version = "1.1.5", default-features = false, features = ["std", "termios"] }

[features]
default = ["postgres"]
# Database backends, additive: enable the ones the application declares.
postgres = [
    "forge-auth/postgres",
    "forge-db/postgres",
    "forge-encryption/postgres",
    "forge-ratelimit?/postgres",
    "forge-cache?/postgres",
    "forge-broadcast?/postgres",
]
# MySQL 8.4+ and MariaDB 11.4+.
mysql = [
    "forge-db/mysql",
    "forge-encryption/mysql",
    "forge-ratelimit?/mysql",
    "forge-cache?/mysql",
]
sqlite = [
    "forge-db/sqlite",
    "forge-encryption/sqlite",
    "forge-ratelimit?/sqlite",
    "forge-cache?/sqlite",
]
# `Composition::for_testing` and `forge::db::testing::TestDatabase`.
testing = [
    "forge-db/testing",
    "forge-jobs?/testing",
    "forge-mail?/testing",
    "forge-tenancy/testing",
]
# Server-rendered views (ADR 0022): `forge::views` and `forge::web::html`.
# Full-stack applications get the mailer and translations too, like Rails'
# Action Mailer and I18n.
views = ["dep:forge-views", "mail", "i18n"]
# Translations (ADR 0037): `forge::i18n`, the JSON catalogs of
# config/locales, CLDR plural rules and localized numbers and dates. The
# request side (locale negotiation, template helpers) is in `forge::views`.
i18n = ["dep:forge-i18n"]
# Email (ADR 0035): `forge::mail`, the SMTP, file and test senders, askama
# templates, previews and the password reset mailer.
mail = ["dep:forge-mail"]
# Durable PostgreSQL jobs, workers and cron schedules (ADR 0025):
# `forge::jobs`, `App::jobs` and the `jobs` subcommands.
jobs = ["postgres", "dep:forge-jobs"]
# Transactional outbox and idempotent consumers (ADR 0025): `forge::events`
# and `App::events`.
events = ["jobs", "dep:forge-events"]
# Rate limiting (ADR 0027), application cache (ADR 0028) and file storage
# (ADR 0029). The database stores follow the backend features above.
ratelimit = ["dep:forge-ratelimit"]
cache = ["dep:forge-cache"]
storage = ["dep:forge-storage"]
# Live page updates over Server-Sent Events (ADR 0031): `forge::broadcast`,
# `Composition::broadcast`. LISTEN/NOTIFY fanout follows the `postgres`
# feature.
broadcast = ["views", "dep:forge-broadcast"]

[[test]]
name = "broadcast"
required-features = ["broadcast", "testing"]

[[example]]
name = "services"
required-features = ["ratelimit", "cache", "storage"]

[dev-dependencies]
async-trait.workspace = true
# The workspace test run covers the live-update wiring (feature-gated tests).
forge = { path = ".", features = ["broadcast", "testing", "sqlite"] }
bytes.workspace = true
forge-db = { path = "../forge-db", features = ["testing"] }
sqlx = { workspace = true, features = ["macros"] }
tempfile.workspace = true
serde_json.workspace = true
uuid.workspace = true
# Test-only: the supply-chain gate (tests/supply_chain.rs) parses every
# gated workflow and template with a real YAML parser and checks that its
# line scanner reads the same keys (docs/dependency-policy.md, "Test-only
# dependencies"). No default features: no encoding_rs.
yaml-rust2 = { version = "=0.13.0", default-features = false }

[lints]
workspace = true
