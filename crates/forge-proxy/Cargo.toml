[package]
name = "forge-proxy"
publish = false
description = "forge-proxy: the zero-downtime reverse proxy `forge deploy` runs on every web host (health-gated switches, draining, ACME TLS)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "forge-proxy"
path = "src/main.rs"

[dependencies]
# Every dependency below is already in the workspace graph (Cargo.lock);
# forge-proxy adds no package. hyper's `client` feature is the one
# forge-telemetry already enables.
base64 = { workspace = true, features = ["std"] }
bytes.workspace = true
getrandom.workspace = true
http.workspace = true
http-body-util.workspace = true
hyper = { workspace = true, features = ["client", "server", "http1"] }
hyper-util.workspace = true
ring = { workspace = true, features = ["std"] }
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-util", "fs"] }
tokio-rustls.workspace = true
tokio-util.workspace = true
url.workspace = true
webpki-roots.workspace = true

[lints]
workspace = true

[dev-dependencies]
tempfile.workspace = true
# The paused clock of the keep-alive unit tests (a feature, no new crate).
tokio = { workspace = true, features = ["test-util"] }
