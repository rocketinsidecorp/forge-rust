[package]
name = "forge-views"
publish = false
description = "Server-rendered views for Forge: HTML responses, Turbo, digested assets, import maps, CSP and form helpers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# `runtime` is what handlers use. An application's `build.rs` depends on this
# crate with `default-features = false, features = ["build"]` to get only the
# asset embedding helper, without the HTTP/template graph. Both are on by
# default so the workspace test run covers the build helper too.
default = ["runtime", "build"]
runtime = [
    "dep:askama",
    "dep:bytes",
    "dep:cookie",
    "dep:forge-auth",
    "dep:forge-core",
    "dep:forge-http",
    "dep:getrandom",
    "dep:serde_json",
    "dep:sha2",
    "dep:subtle",
    "dep:tracing",
]
build = ["dep:sha2"]

[dependencies]
askama = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
cookie = { workspace = true, optional = true }
forge-auth = { path = "../forge-auth", optional = true }
forge-core = { path = "../forge-core", optional = true }
forge-http = { path = "../forge-http", optional = true }
getrandom = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
subtle = { workspace = true, optional = true }
thiserror.workspace = true
tracing = { workspace = true, optional = true }

[dev-dependencies]
serde.workspace = true
tempfile.workspace = true
tokio.workspace = true
uuid.workspace = true

[lints]
workspace = true
