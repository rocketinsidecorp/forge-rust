<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="title">
  <title id="title">Forge Rust — Rust Framework</title>
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#2a1a12"/>
      <stop offset="0.55" stop-color="#140e0b"/>
      <stop offset="1" stop-color="#080605"/>
    </radialGradient>
    <linearGradient id="copper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7c08a"/>
      <stop offset="0.35" stop-color="#d9823f"/>
      <stop offset="0.7" stop-color="#a54e1f"/>
      <stop offset="1" stop-color="#6b2e12"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd9ad"/>
      <stop offset="1" stop-color="#b8602a"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ff7a1a"/>
      <stop offset="0.6" stop-color="#ffb04d"/>
      <stop offset="1" stop-color="#ffe2b0"/>
    </linearGradient>
    <linearGradient id="text" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3e2d2"/>
      <stop offset="0.55" stop-color="#d8b9a0"/>
      <stop offset="1" stop-color="#a98468"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ff8a2a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff8a2a" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.7"/>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>
  <ellipse cx="236" cy="210" rx="120" ry="120" fill="url(#glow)"/>

  <!-- The F mark: angled top arm, shorter middle arm, and a stem split by an S-shaped flame. -->
  <g filter="url(#shadow)">
    <path d="M186 92 H380 L348 140 H262 Z" fill="url(#copper)" stroke="url(#edge)" stroke-width="2" stroke-linejoin="round"/>
    <path d="M272 168 H346 L316 210 H272 Z" fill="url(#copper)" stroke="url(#edge)" stroke-width="2" stroke-linejoin="round"/>
    <path d="M186 92 L222 92 C 252 118 232 150 210 178 C 190 204 204 236 214 262 L 214 318 L 186 290 Z"
          fill="url(#copper)" stroke="url(#edge)" stroke-width="2" stroke-linejoin="round"/>
    <path d="M238 92 L262 92 L262 140 C 262 150 256 158 250 166 C 230 194 240 222 258 246 C 270 262 272 284 262 300 L 262 336 L 234 336 L 234 300 C 244 284 242 266 230 250 C 210 222 214 190 236 160 C 248 142 252 112 238 92 Z"
          fill="url(#copper)" stroke="url(#edge)" stroke-width="2" stroke-linejoin="round"/>
  </g>
  <path d="M226 100 C 248 124 236 150 218 178 C 200 206 212 234 222 258"
        fill="none" stroke="url(#flame)" stroke-width="12" stroke-linecap="round" filter="url(#soft)" opacity="0.85"/>
  <path d="M226 100 C 248 124 236 150 218 178 C 200 206 212 234 222 258"
        fill="none" stroke="url(#flame)" stroke-width="3" stroke-linecap="round"/>

  <text x="256" y="408" text-anchor="middle"
        font-family="Montserrat, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="62" font-weight="700"
        letter-spacing="-1" fill="url(#text)" filter="url(#shadow)">Forge Rust</text>

  <g stroke="#c0682e" stroke-width="2">
    <line x1="70" y1="446" x2="130" y2="446"/>
    <line x1="382" y1="446" x2="442" y2="446"/>
  </g>
  <text x="256" y="452" text-anchor="middle"
        font-family="Montserrat, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="500"
        letter-spacing="5" fill="#d27a3c">RUST FRAMEWORK</text>
</svg>
