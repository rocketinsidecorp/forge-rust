# Development convenience only; not a production orchestration contract.
services:
  app:
    build: .
    image: hello-forge:dev
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      FORGE_LOG: info
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Must exceed FORGE_HTTP_SHUTDOWN_TIMEOUT (15s by default) and the job
    # drain (20s, then 5s to cancel and hand jobs back), like forge deploy.
    stop_grace_period: 35s
