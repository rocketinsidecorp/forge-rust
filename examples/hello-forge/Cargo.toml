[package]
name = "hello-forge"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "app"
path = "src/lib.rs"

[[bin]]
name = "hello-forge"
path = "src/main.rs"

[dependencies]
askama = { version = "0.16.1", default-features = false, features = ["derive", "std"] }
forge = { path = "../../crates/forge", default-features = false, features = ["views"] }
serde = { version = "1", features = ["derive"] }

[build-dependencies]
# Only the asset embedding helper used by build.rs: no HTTP or template graph.
forge-views = { path = "../../crates/forge-views", default-features = false, features = ["build"] }

[dev-dependencies]
# tests/openapi.rs reads the served OpenAPI document.
serde_json = "1"
tokio = { version = "1.53.1", features = ["macros", "rt"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
expect_used = "deny"
unwrap_used = "deny"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
