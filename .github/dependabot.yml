# Dependency update pull requests for the framework repository.
# Updates run the full CI gate; they are never merged without review
# (see docs/dependency-policy.md).
#
# The Docker base images used by generated applications are defined in the
# forge-cli generator source, not in a Dockerfile at this repository's root,
# so Dependabot cannot update them here; forge-proxy's own Dockerfile is below.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps"

  # examples/hello-forge is a standalone package outside the workspace with its
  # own Cargo.lock. Its Cargo.toml is generator output enforced by a golden
  # test, so only the lockfile may be updated here.
  - package-ecosystem: cargo
    directory: /examples/hello-forge
    versioning-strategy: lockfile-only
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps(example)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"

  # forge-proxy's image (crates/forge-proxy/Dockerfile): base images are pinned
  # by digest, which Dependabot refreshes. The digests inside workflow `run:`
  # steps and `sbom: generator=` it does not see; docs/supply-chain.md lists
  # them.
  - package-ecosystem: docker
    directory: /crates/forge-proxy
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"

  # The fuzz package is a standalone workspace with its own lockfile and is
  # never part of a release; see docs/dependency-policy.md, "Fuzzing".
  - package-ecosystem: cargo
    directory: /fuzz
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps(fuzz)"
