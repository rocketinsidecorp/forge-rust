name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

# Every action is pinned to a full commit SHA with its version in a comment, and
# every container a workflow runs (the database service below, Syft in
# scripts/sbom.sh) to the digest of its multi-architecture index; the
# crates/forge/tests/supply_chain.rs gate fails `cargo test` when one is not.
# New pins use releases at least a week old. docs/supply-chain.md says how to
# update them.
#
# No toolchain action is used: rustup is preinstalled on GitHub-hosted runners,
# and the first `cargo` invocation installs the channel and components pinned in
# rust-toolchain.toml. (`rustup show` no longer installs it since rustup 1.28.)

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain from rust-toolchain.toml
        run: cargo --version
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: fuzz format check
        run: cargo fmt --manifest-path fuzz/Cargo.toml --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain from rust-toolchain.toml
        run: cargo --version
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Clippy (warnings denied)
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # forge deploy's SSH tests (crates/forge-cli/src/deploy/ssh_tests.rs)
      # fail instead of skipping when sshd, ssh or ssh-keygen is missing.
      FORGE_TEST_REQUIRE_SSHD: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain from rust-toolchain.toml
        run: cargo --version
      - name: OpenSSH server for the deploy SSH tests
        # The tests start their own unprivileged sshd on 127.0.0.1; the
        # system service the package starts is not used.
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends openssh-server openssh-client
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            .
            examples/hello-forge
      - name: Unit, integration and golden tests
        run: cargo test --workspace --all-targets --locked
      - name: Doctests
        run: cargo test --workspace --doc --locked
      # examples/hello-forge is a standalone package (excluded from the
      # workspace) with its own Cargo.lock, checked like a real generated app.
      - name: hello-forge format check
        run: cargo fmt --manifest-path examples/hello-forge/Cargo.toml --all -- --check
      - name: hello-forge clippy
        run: cargo clippy --manifest-path examples/hello-forge/Cargo.toml --all-targets --locked -- -D warnings
      - name: hello-forge tests
        run: cargo test --manifest-path examples/hello-forge/Cargo.toml --all-targets --locked

  e2e:
    name: e2e (generated app, host and container)
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain from rust-toolchain.toml
        run: cargo --version
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Show Docker version
        run: docker version
      - name: Generated application end-to-end
        run: bash scripts/e2e-generated-app.sh

  scaffold:
    name: scaffold (generated apps with forge generate scaffold)
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:18.6-trixie@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_PASSWORD: forge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      FORGE_TEST_DATABASE_URL: postgres://postgres:forge@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain from rust-toolchain.toml
        run: cargo --version
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Scaffold PostgreSQL, SQLite and MySQL applications and run their gates
        run: cargo test -p forge-cli --test scaffold --locked -- --ignored

  database:
    # The #[ignore]d tests, which need database servers: PostgreSQL 18 and
    # 16, MySQL 8.4 and MariaDB 11.8, through the FORGE_TEST_*_URL variables
    # the crates read. scripts/test-databases.sh is the set; the
    # generated-application suite stays in the scaffold job. One build, run
    # once per PostgreSQL major version.
    name: database (PostgreSQL 18 and 16, MySQL, MariaDB)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:18.6-trixie@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_PASSWORD: forge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
      postgres16:
        image: postgres:16.14-trixie@sha256:95206741a5b214807675e14165369d05b93a9cf692223b616d07cca227e74b0b
        env:
          POSTGRES_PASSWORD: forge
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
      mysql:
        image: mysql:8.4@sha256:0f51e63e537a1f176423fa03ef559aabe6fa4372a53160a44bc7e75da7d15364
        env:
          MYSQL_ROOT_PASSWORD: forge
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pforge"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      mariadb:
        image: mariadb:11.8@sha256:f16d7a344413e519dff518f27bdb221388f84b0d274c97c4fb5f2cb0dc1b34fa
        env:
          MARIADB_ROOT_PASSWORD: forge
        ports:
          - 3307:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      FORGE_TEST_DATABASE_URL: postgres://postgres:forge@127.0.0.1:5432/postgres
      FORGE_TEST_MYSQL_URL: mysql://root:forge@127.0.0.1:3306/mysql
      FORGE_TEST_MARIADB_URL: mariadb://root:forge@127.0.0.1:3307/mysql
      FORGE_TEST_REQUIRE_SSHD: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain from rust-toolchain.toml
        run: cargo --version
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: OpenSSH server for the deploy SSH tests
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends openssh-server openssh-client
      - name: Every test, the database ones included (PostgreSQL 18)
        run: scripts/test-databases.sh
      - name: Every test, the database ones included (PostgreSQL 16)
        env:
          FORGE_TEST_DATABASE_URL: postgres://postgres:forge@127.0.0.1:5433/postgres
        run: scripts/test-databases.sh

  coverage:
    # Line coverage of the framework crates with cargo-llvm-cov over the
    # database job's test set (PostgreSQL 18, MySQL, MariaDB, real sshd).
    # scripts/coverage.sh writes
    # the total and a per-crate table to the step summary and fails below
    # .coverage-floor, which only ever rises toward 95 (docs/test-strategy.md,
    # "Coverage").
    name: coverage (cargo llvm-cov, gated by .coverage-floor)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:18.6-trixie@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_PASSWORD: forge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
      mysql:
        image: mysql:8.4@sha256:0f51e63e537a1f176423fa03ef559aabe6fa4372a53160a44bc7e75da7d15364
        env:
          MYSQL_ROOT_PASSWORD: forge
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pforge"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      mariadb:
        image: mariadb:11.8@sha256:f16d7a344413e519dff518f27bdb221388f84b0d274c97c4fb5f2cb0dc1b34fa
        env:
          MARIADB_ROOT_PASSWORD: forge
        ports:
          - 3307:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      FORGE_TEST_DATABASE_URL: postgres://postgres:forge@127.0.0.1:5432/postgres
      FORGE_TEST_MYSQL_URL: mysql://root:forge@127.0.0.1:3306/mysql
      FORGE_TEST_MARIADB_URL: mariadb://root:forge@127.0.0.1:3307/mysql
      FORGE_TEST_REQUIRE_SSHD: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain from rust-toolchain.toml, with llvm-tools
        run: |
          cargo --version
          rustup component add llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: ./.github/actions/cargo-tool
        with:
          tool: cargo-llvm-cov
          version: 0.9.1
      - name: OpenSSH server for the deploy SSH tests
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends openssh-server openssh-client
      - name: Coverage
        run: scripts/coverage.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage
          path: target/coverage
          if-no-files-found: ignore
          retention-days: 30

  fuzz:
    # Every fuzz target of fuzz/, found by scripts/fuzz.sh from fuzz/Cargo.toml,
    # for a short time each after replaying its committed seeds. The nightly
    # Fuzz workflow (fuzz.yml) runs them longer. cargo-fuzz needs the nightly
    # toolchain pinned in scripts/fuzz.sh; nothing else in CI does.
    name: fuzz (every target, 10 s each)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned nightly toolchain
        run: rustup toolchain install "$(scripts/fuzz.sh -T)" --profile minimal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: fuzz
          shared-key: fuzz-${{ hashFiles('scripts/fuzz.sh', 'fuzz/Cargo.lock') }}
      - uses: ./.github/actions/cargo-tool
        with:
          tool: cargo-fuzz
          version: 0.13.2
      - name: Fuzz
        run: scripts/fuzz.sh -t 10s
      - name: Collect failing inputs
        if: failure()
        run: scripts/fuzz.sh -c "$RUNNER_TEMP/fuzz-failures"
      - name: Upload failing inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-failures
          path: ${{ runner.temp }}/fuzz-failures
          if-no-files-found: ignore
          retention-days: 30

  sbom:
    # CycloneDX and SPDX SBOMs of the forge and forge-proxy binaries (read from
    # the dependency list cargo-auditable embeds) and of Cargo.lock; Syft runs
    # from its image, pinned by digest, without network access.
    name: sbom (CycloneDX and SPDX)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain from rust-toolchain.toml
        run: cargo --version
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: ./.github/actions/cargo-tool
        with:
          tool: cargo-auditable
          version: 0.7.7
      - name: Build the binaries and their SBOMs
        run: scripts/sbom.sh "$RUNNER_TEMP/sbom"
      - name: The SBOMs describe the binaries
        env:
          SBOM_DIR: ${{ runner.temp }}/sbom
        run: |
          for name in forge forge-proxy workspace; do
            jq -e '.bomFormat == "CycloneDX" and (.components | length) > 50' "$SBOM_DIR/$name.cdx.json"
            jq -e '(.spdxVersion | startswith("SPDX-")) and (.packages | length) > 50' "$SBOM_DIR/$name.spdx.json"
          done
          jq -e '[.components[] | select(.name == "rustls")] | length >= 1' "$SBOM_DIR/forge-proxy.cdx.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: ${{ runner.temp }}/sbom
          if-no-files-found: error
          retention-days: 30

  # Non-gating: keeps the benchmarks compiling and running (docs/benchmarks.md).
  # It runs every micro-benchmark once, then the end-to-end rig for one second
  # per scenario. It compares and stores no numbers: shared runners are too
  # noisy for that.
  benchmarks:
    name: benchmarks (every scenario once, non-gating)
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:18.6-trixie@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_PASSWORD: forge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      FORGE_TEST_DATABASE_URL: postgres://postgres:forge@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain from rust-toolchain.toml
        run: cargo --version
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Micro-benchmarks, each scenario once
        run: cargo bench -p forge-bench --bench micro --locked -- --quick
      - name: End-to-end benchmark, one short run
        env:
          BENCH_DURATION: 1s
          BENCH_WARMUP: 1s
          BENCH_RUNS: 1
        run: scripts/bench.sh
