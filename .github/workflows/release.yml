name: Release

# Publishes the forge-proxy image for a version tag, and only for one: no
# pull request, branch push or schedule runs this workflow. Each image is
# pushed to ghcr.io with SLSA provenance and an SPDX SBOM attached by BuildKit,
# then signed keyless with Sigstore cosign through GitHub's OIDC token: the
# signature's certificate names this workflow file and the tag. Verify with
# the cosign verify command in docs/supply-chain.md.
on:
  push:
    tags: ["v*"]

# Nothing by default; each job asks for what it needs.
permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify the tag
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The tag is a version on the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::the tag is not a version such as v1.2.3 or v1.2.3-rc.1"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/$DEFAULT_BRANCH"; then
            echo "::error::$GITHUB_REF_NAME points at a commit that is not on $DEFAULT_BRANCH"
            exit 1
          fi

  images:
    name: Image ${{ matrix.image }}
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write # push the image and its signature to ghcr.io
      id-token: write # keyless signing: Sigstore certifies this workflow's identity
    strategy:
      fail-fast: true
      matrix:
        include:
          - image: forge-proxy
            dockerfile: crates/forge-proxy/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name
        id: name
        env:
          NAME: ${{ matrix.image }}
        # Registry paths are lowercase; the owner's name may not be.
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${NAME}" >> "$GITHUB_OUTPUT"
      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          # linux/amd64 only: the Dockerfile compiles natively, and an arm64
          # build under emulation takes hours. An arm64 image is a follow-up
          # (docs/supply-chain.md).
          platforms: linux/amd64
          push: true
          tags: ${{ steps.name.outputs.image }}:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.licenses=MIT
          # SLSA provenance with the build's full inputs, and an SPDX SBOM
          # from BuildKit's Syft scanner, pinned by digest (stable-1 tag).
          provenance: mode=max
          sbom: generator=docker.io/docker/buildkit-syft-scanner:stable-1@sha256:ae4f3b554449e7e25548e7d8ccc029d17357348e30c6e3df01b92bc93654d6a9
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign
        env:
          IMAGE: ${{ steps.name.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        # Signs the image index by digest, never by tag; the index references
        # the provenance and SBOM, so the signature covers them.
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
      - name: Verify the signature
        env:
          IMAGE: ${{ steps.name.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign verify "${IMAGE}@${DIGEST}" \
            --certificate-identity "${GITHUB_SERVER_URL}/${GITHUB_WORKFLOW_REF}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
          echo "- \`${IMAGE}:${GITHUB_REF_NAME}\` = \`${IMAGE}@${DIGEST}\`, signed" >> "$GITHUB_STEP_SUMMARY"

  sbom:
    name: Binary SBOMs
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain from rust-toolchain.toml
        run: cargo --version
      # A release builds from a clean build cache: no rust-cache action here.
      - name: Install cargo-auditable
        run: cargo install cargo-auditable --version 0.7.7 --locked
      - name: Build the forge and forge-proxy binaries and their SBOMs
        run: scripts/sbom.sh "$RUNNER_TEMP/sbom"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ github.ref_name }}-linux-amd64
          path: ${{ runner.temp }}/sbom
          if-no-files-found: error
          retention-days: 90
