# Coverage-guided fuzz targets for the parsers that face untrusted or
# operator-supplied input (docs/supply-chain.md, ADR 0043).
#
# This is a standalone package with its own workspace and Cargo.lock, excluded
# from the framework workspace like examples/: libfuzzer-sys (and the C++
# libFuzzer it builds) never enters the framework's dependency graph, its
# lockfile or any released binary, and `cargo-fuzz` needs a nightly toolchain
# that the rest of the repository does not. Run it with scripts/fuzz.sh.
#
# Every target has a `bin` table at the end of this file: `cargo fuzz list`
# (and so CI) discovers the targets from it. The tests/supply_chain.rs gate of
# the `forge` crate fails when a file in fuzz_targets/ has no entry or no seed
# corpus.
[package]
name = "forge-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
rust-version = "1.98.1"
license = "MIT"
description = "Fuzz targets of the Forge framework (not part of the framework workspace)"

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
# The only new third-party crate (with the `arbitrary` and `cc` it needs):
# docs/dependency-policy.md, "Fuzzing".
libfuzzer-sys = "0.4.13"

forge-config = { path = "../crates/forge-config" }
forge-credentials = { path = "../crates/forge-credentials" }
forge-encryption = { path = "../crates/forge-encryption" }
forge-http = { path = "../crates/forge-http" }
forge-i18n = { path = "../crates/forge-i18n" }
forge-mail = { path = "../crates/forge-mail" }
forge-openapi = { path = "../crates/forge-openapi" }
forge-proxy = { path = "../crates/forge-proxy" }
forge-storage = { path = "../crates/forge-storage" }
forge-telemetry = { path = "../crates/forge-telemetry" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# Already in the locked graph (forge-http, forge-storage); named here because
# the http and storage targets build a `Request` and implement `Storage`.
async-trait = "0.1.92"
bytes = "1.12.1"
uuid = "1.26.1"

[lints.rust]
# fuzz_target! expands to `unsafe extern "C"` glue, so unsafe_code is not
# forbidden here; the targets themselves contain none.
unused_must_use = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[profile.release]
debug = 1

[[bin]]
name = "config_database_url"
path = "fuzz_targets/config_database_url.rs"
test = false
doc = false
bench = false

